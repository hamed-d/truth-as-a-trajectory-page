<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" font-family="'Noto Sans', sans-serif">
  <rect width="960" height="280" fill="#f8f9fa" rx="12"/>

  <!-- ===== Box 1: Input ===== -->
  <rect x="20" y="90" width="130" height="100" rx="10" fill="white" stroke="#6c63ff" stroke-width="2"/>
  <text x="85" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c63ff">Input</text>
  <text x="85" y="138" text-anchor="middle" font-size="11" fill="#444">"Is the sky blue?"</text>
  <text x="85" y="155" text-anchor="middle" font-size="11" fill="#888">+ "True" / "False"</text>
  <text x="85" y="172" text-anchor="middle" font-size="10" fill="#888">candidates</text>

  <!-- Arrow 1→2 -->
  <line x1="151" y1="140" x2="183" y2="140" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Box 2: Transformer ===== -->
  <rect x="185" y="70" width="150" height="140" rx="10" fill="white" stroke="#3498db" stroke-width="2"/>
  <text x="260" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#3498db">Transformer</text>
  <!-- Mini layer stack -->
  <rect x="205" y="110" width="110" height="14" rx="3" fill="#d6eaf8"/>
  <rect x="205" y="128" width="110" height="14" rx="3" fill="#aed6f1"/>
  <rect x="205" y="146" width="110" height="14" rx="3" fill="#85c1e9"/>
  <rect x="205" y="164" width="110" height="14" rx="3" fill="#5dade2"/>
  <rect x="205" y="182" width="110" height="14" rx="3" fill="#3498db"/>
  <text x="260" y="120" text-anchor="middle" font-size="9" fill="#555">Layer 1: h₁</text>
  <text x="260" y="138" text-anchor="middle" font-size="9" fill="#555">Layer 2: h₂</text>
  <text x="260" y="156" text-anchor="middle" font-size="9" fill="#555">Layer 3: h₃</text>
  <text x="260" y="174" text-anchor="middle" font-size="9" fill="#eee">⋮</text>
  <text x="260" y="192" text-anchor="middle" font-size="9" fill="white">Layer L: hₗ</text>

  <!-- Arrow 2→3 -->
  <line x1="336" y1="140" x2="368" y2="140" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Box 3: Trajectory ===== -->
  <rect x="370" y="70" width="160" height="140" rx="10" fill="white" stroke="#e67e22" stroke-width="2"/>
  <text x="450" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">Activation</text>
  <text x="450" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">Trajectory</text>
  <!-- Mini trajectory viz -->
  <g stroke="#e67e22" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M 390 185 C 410 165 430 175 450 155 C 470 135 490 160 510 145"/>
  </g>
  <circle cx="390" cy="185" r="3" fill="#e67e22"/>
  <circle cx="420" cy="168" r="3" fill="#e67e22"/>
  <circle cx="450" cy="155" r="3" fill="#e67e22"/>
  <circle cx="480" cy="148" r="3" fill="#e67e22"/>
  <circle cx="510" cy="145" r="3" fill="#e67e22"/>
  <text x="450" y="210" text-anchor="middle" font-size="10" fill="#888">T ∈ ℝᴹˣᵈ</text>

  <!-- Arrow 3→4 with label -->
  <line x1="531" y1="140" x2="563" y2="140" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="547" y="128" text-anchor="middle" font-size="9" fill="#e74c3c">Δhₜ,ₗ =</text>
  <text x="547" y="138" text-anchor="middle" font-size="9" fill="#e74c3c">hₜ,ₗ₊₁ − hₜ,ₗ</text>

  <!-- ===== Box 4: Displacements ===== -->
  <rect x="565" y="70" width="155" height="140" rx="10" fill="white" stroke="#e74c3c" stroke-width="2"/>
  <text x="642" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#e74c3c">Layer-wise</text>
  <text x="642" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#e74c3c">Displacements</text>
  <!-- Displacement vectors -->
  <g stroke="#e74c3c" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="585" y1="175" x2="615" y2="155" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#redarrow)"/>
    <line x1="615" y1="155" x2="645" y2="165" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#redarrow)"/>
    <line x1="645" y1="165" x2="675" y2="148" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#redarrow)"/>
    <line x1="675" y1="148" x2="703" y2="150" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#redarrow)"/>
  </g>
  <text x="642" y="205" text-anchor="middle" font-size="10" fill="#888">S ∈ ℝᴹˣᵈ</text>

  <!-- Arrow 4→5 -->
  <line x1="721" y1="140" x2="753" y2="140" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Box 5: LSTM + Output ===== -->
  <rect x="755" y="70" width="185" height="140" rx="10" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="847" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">LSTM Classifier</text>
  <!-- LSTM cell icon -->
  <rect x="800" y="110" width="95" height="40" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="847" y="135" text-anchor="middle" font-size="12" fill="#1a7a43">LSTM</text>
  <!-- Output -->
  <rect x="810" y="165" width="35" height="25" rx="5" fill="#27ae60"/>
  <text x="827" y="182" text-anchor="middle" font-size="10" fill="white">Valid</text>
  <rect x="855" y="165" width="35" height="25" rx="5" fill="#e74c3c"/>
  <text x="872" y="182" text-anchor="middle" font-size="10" fill="white">Invalid</text>
  <line x1="847" y1="150" x2="847" y2="163" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="847" y1="163" x2="827" y2="163" stroke="#27ae60" stroke-width="1.5" marker-end="url(#greenarrow)"/>
  <line x1="847" y1="163" x2="872" y2="163" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#redarrow)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e74c3c"/>
    </marker>
    <marker id="greenarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Step numbers -->
  <circle cx="85" cy="62" r="12" fill="#6c63ff"/>
  <text x="85" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="white">1</text>
  <circle cx="260" cy="50" r="12" fill="#3498db"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="white">2</text>
  <circle cx="450" cy="50" r="12" fill="#e67e22"/>
  <text x="450" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="white">3</text>
  <circle cx="642" cy="50" r="12" fill="#e74c3c"/>
  <text x="642" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="white">4</text>
  <circle cx="847" cy="50" r="12" fill="#27ae60"/>
  <text x="847" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="white">5</text>

  <!-- Step labels below -->
  <text x="85" y="210" text-anchor="middle" font-size="10" fill="#666">Prompt +</text>
  <text x="85" y="223" text-anchor="middle" font-size="10" fill="#666">Continuation</text>
  <text x="260" y="235" text-anchor="middle" font-size="10" fill="#666">Extract all</text>
  <text x="260" y="248" text-anchor="middle" font-size="10" fill="#666">layer activations</text>
  <text x="450" y="235" text-anchor="middle" font-size="10" fill="#666">Unrolled</text>
  <text x="450" y="248" text-anchor="middle" font-size="10" fill="#666">trajectory grid</text>
  <text x="642" y="235" text-anchor="middle" font-size="10" fill="#666">Subtract static</text>
  <text x="642" y="248" text-anchor="middle" font-size="10" fill="#666">lexical content</text>
  <text x="847" y="235" text-anchor="middle" font-size="10" fill="#666">Classify reasoning</text>
  <text x="847" y="248" text-anchor="middle" font-size="10" fill="#666">validity</text>
</svg>
